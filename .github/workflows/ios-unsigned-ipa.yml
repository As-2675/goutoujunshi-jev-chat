# =============================================================================
# 云构建「未签名真机 IPA」
#
# 放到仓库的：  .github/workflows/ios-unsigned-ipa.yml
#
# 产物：GoutouJunshi-unsigned.ipa（Payload/GoutouJunshi.app，arm64，device 构建）
#       包本身不能直装 iPhone，需要 Sideloadly / AltStore 用你自己的 Apple ID
#       重签后才能安装（详见同目录 README）。
#
# 两个出口，任选其一：
#   1. Actions → 本次运行 → Artifacts → GoutouJunshi-unsigned-ipa
#   2. 分支 unsigned-ipa（workflow 会把 ipa 单独提交到一个 orphan 分支），
#      可直接 https://codeload.github.com/<owner>/<repo>/zip/refs/heads/unsigned-ipa
#      下载 zip 后解压拿包 —— 给 github.com 被墙、objects.githubusercontent.com
#      连不上的网络用。
#
# 已按 shengjidaguai-china/goutoujunshi-jev-chat 的实际结构预设：
#   project = integrations/jev_ios/GoutouJunshi.xcodeproj
#   scheme  = GoutouJunshi（仓库里唯一的 shared scheme）
# =============================================================================
name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      project:
        description: "xcodeproj 相对路径"
        required: false
        default: "integrations/jev_ios/GoutouJunshi.xcodeproj"
      scheme:
        description: "Xcode scheme（留空则自动探测）"
        required: false
        default: "GoutouJunshi"
  push:
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"

permissions:
  contents: write

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选用最新的 Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "--- 镜像里预装的 Xcode ---"
          ls -d /Applications/Xcode*.app || true
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "${latest}" ]; then
            echo "切换到 ${latest}"
            sudo xcode-select -s "${latest}/Contents/Developer" || true
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: 确定 project / scheme
        id: probe
        shell: bash
        env:
          PROJ_INPUT: ${{ github.event.inputs.project }}
          SCHEME_INPUT: ${{ github.event.inputs.scheme }}
        run: |
          set -euo pipefail
          PROJ="${PROJ_INPUT:-integrations/jev_ios/GoutouJunshi.xcodeproj}"
          if [ ! -d "${PROJ}" ]; then
            echo "::error::找不到工程目录 ${PROJ}"
            exit 1
          fi
          SCHEME="${SCHEME_INPUT:-}"
          if [ -z "${SCHEME}" ]; then
            SCHEME="$(xcodebuild -list -project "${PROJ}" 2>/dev/null \
              | awk '/^[[:space:]]*Schemes:/{f=1;next} f && /^[[:space:]]*$/{exit} f{gsub(/^[[:space:]]+/,""); if(length($0)){print;exit}}')"
          fi
          [ -n "${SCHEME}" ] || SCHEME="GoutouJunshi"
          echo "project=${PROJ}" >> "${GITHUB_OUTPUT}"
          echo "scheme=${SCHEME}"  >> "${GITHUB_OUTPUT}"
          echo "本次使用： project=${PROJ}  scheme=${SCHEME}"
          xcodebuild -list -project "${PROJ}"

      - name: 编译（关闭代码签名，device / arm64）
        shell: bash
        env:
          PROJ: ${{ steps.probe.outputs.project }}
          SCHEME: ${{ steps.probe.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJ}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 组装 Payload 并打包 ipa
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="${RUNNER_TEMP}/dd/Build/Products/Release-iphoneos"
          APP="$(find "${PRODUCT_DIR}" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "${APP}" ]; then
            echo "::error::没有找到 .app，下面是产物目录："
            ls -la "${PRODUCT_DIR}" || true
            exit 1
          fi
          APP_NAME="$(basename "${APP}" .app)"
          echo "找到 ${APP_NAME}.app"
          echo "--- 内嵌扩展 ---"
          ls "${APP}/PlugIns" 2>/dev/null || echo "(没有 PlugIns 目录)"

          STAGE="${RUNNER_TEMP}/stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/Payload"
          cp -R "${APP}" "${STAGE}/Payload/"

          IPA="${RUNNER_TEMP}/${APP_NAME}-unsigned.ipa"
          ( cd "${STAGE}" && ditto -c -k --sequesterRsrc --keepParent Payload "${IPA}" )

          echo "ipa=${IPA}" >> "${GITHUB_OUTPUT}"
          echo "app_name=${APP_NAME}" >> "${GITHUB_OUTPUT}"

          echo "--- ipa 结构（前 20 行）---"
          unzip -l "${IPA}" | head -n 20
          echo "--- 可执行文件架构（应为 arm64）---"
          BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Info.plist")"
          file "${APP}/${BIN}" || true
          echo "最小系统版本："
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${APP}/Info.plist" || true
          shasum -a 256 "${IPA}"
          ls -lh "${IPA}"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoutouJunshi-unsigned-ipa
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30

      - name: 把 ipa 推到 unsigned-ipa 分支（给受限网络直接下载）
        if: success()
        shell: bash
        env:
          IPA_PATH: ${{ steps.pack.outputs.ipa }}
          APP_NAME: ${{ steps.pack.outputs.app_name }}
          # run 步骤里没有默认的 GITHUB_TOKEN 环境变量，必须显式映射
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/ipa-branch"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          cp "${IPA_PATH}" "${OUT}/${APP_NAME}-unsigned.ipa"
          ( cd "${OUT}" && shasum -a 256 *.ipa > SHA256SUMS.txt )

          cd "${OUT}"
          git init -q
          git checkout -q -b unsigned-ipa
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "unsigned ipa $(date -u +%Y%m%dT%H%M%SZ)"
          if git push -q --force \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" unsigned-ipa; then
            echo "已推送：https://codeload.github.com/${GITHUB_REPOSITORY}/zip/refs/heads/unsigned-ipa"
          else
            # 分支只是「受限网络下载」的备用通道，失败不影响 Artifacts 里的成品
            echo "::warning::推送到 unsigned-ipa 分支失败，请用本次运行的 Artifacts 下载"
          fi

      - name: 结果摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### 构建${{ job.status }}"
            echo ""
            echo "- App：\`${{ steps.pack.outputs.app_name }}\`"
            echo "- 这个包是**未签名**的，不能直接安装到 iPhone。"
            echo "- 下载：本次运行 Artifacts，或分支 \`unsigned-ipa\` 的 zip。"
            echo "- 下一步：Sideloadly 用你的 Apple ID 重签安装。"
          } >> "${GITHUB_STEP_SUMMARY}"
